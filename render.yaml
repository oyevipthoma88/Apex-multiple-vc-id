services:
  - type: web
    name: vc-joiner-bot
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: DB_NAME
        value: vcjoiner
      - key: PORT
        value: 8080
    healthCheckPath: /health
